{% extends "app/base_app.html" %}
{% block title %}{{ title }} | QuizlyNotes{% endblock %}
{% block body_class %}page-player{% endblock %}
{% block content %}
<section class="wrap player-wrap">
  <header class="player-head">
    <a class="back" href="{{ url_for('study.library') }}">← Library</a>
    <p class="eyebrow" style="margin-top:.75rem">{% if site.monetisation %}Pro · {% endif %}{{ subtitle }}</p>
    <h1 class="player-title">{{ title }}</h1>
  </header>
  <div id="player" class="player"></div>
</section>
<script type="application/json" id="quiz-data">{{ payload|tojson }}</script>
{% endblock %}
{% block scripts %}<script src="{{ asset('js/quiz.js') }}" defer></script>{% endblock %}
