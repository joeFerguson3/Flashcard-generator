{% set faq_ld = [] %}{% for q, a in faq %}{% set _ = faq_ld.append({"@type": "Question", "name": q, "acceptedAnswer": {"@type": "Answer", "text": a}}) %}{% endfor %}
<div class="faq">
  {% for q, a in faq %}
  <details class="faq__item"{% if loop.first %} open{% endif %}>
    <summary><h3>{{ q }}</h3></summary>
    <p>{{ a }}</p>
  </details>
  {% endfor %}
</div>
<script type="application/ld+json">
{{ {"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": faq_ld}|tojson }}
</script>
